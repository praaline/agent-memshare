# Release: on a version tag (v1.2.3), builds the Native AOT executable on each platform (Native AOT
# can't build for another OS), packages it with the licence and README, and publishes a GitHub
# release with the archives, the install scripts, their SHA256SUMS and signed build provenance
# (verify with `gh attestation verify <archive> --repo praaline/agent-memshare`). GitHub only: it
# needs Windows and macOS runners.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds on the oldest supported runner: the executable needs glibc of that age or newer.
          - { os: ubuntu-22.04, rid: linux-x64, archive: tar.gz }
          - { os: ubuntu-22.04-arm, rid: linux-arm64, archive: tar.gz }
          - { os: windows-latest, rid: win-x64, archive: zip }
          - { os: windows-11-arm, rid: win-arm64, archive: zip }
          - { os: macos-15-intel, rid: osx-x64, archive: tar.gz }
          - { os: macos-latest, rid: osx-arm64, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Native toolchain on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev >/dev/null
      - name: Test
        run: dotnet test --configuration Release
      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Memshare.Cli --configuration Release --runtime ${{ matrix.rid }} \
            -p:Version="$version" --output publish
          mkdir package
          cp publish/memshare* package/ 2>/dev/null || true
          rm -f package/*.pdb package/*.dbg package/*.xml package/*.dSYM
          cp LICENSE README.md package/
          ./package/memshare --version
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf memshare-${{ matrix.rid }}.tar.gz -C package .
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath memshare-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memshare-${{ matrix.rid }}
          path: memshare-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # signs the build provenance (Sigstore, through GitHub)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Install scripts and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist && sha256sum memshare-* install.sh install.ps1 > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/memshare-*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
